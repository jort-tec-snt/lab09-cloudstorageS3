# Levanta backend (puerto 3000) y frontend (puerto 8080).
# Las credenciales se leen de backend/.env (ignorado por Git y por la imagen).
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
