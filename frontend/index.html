<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Bóveda de imágenes</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-inner">
        <div class="brand">
          <h1>Bóveda de imágenes</h1>
          <p>Tus fotos viven en un bucket privado de Amazon S3. Solo se ven con enlaces temporales.</p>
        </div>
        <div class="lease" id="lease" hidden>
          <span class="lease-label">Enlaces de lectura válidos por</span>
          <strong class="lease-time" id="lease-time">15:00</strong>
          <span class="lease-bar" aria-hidden="true"><span id="lease-fill"></span></span>
        </div>
      </div>
    </header>

    <main>
      <section aria-labelledby="upload-title" class="upload">
        <h2 id="upload-title" class="sr-only">Subir imagen</h2>
        <div id="dropzone" class="dropzone" role="button" tabindex="0" aria-describedby="drop-hint">
          <svg class="drop-icon" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          <div>
            <p class="drop-main">Suelta tus imágenes aquí o <span class="link-like">elige archivos</span></p>
            <p id="drop-hint" class="drop-hint">JPEG, PNG o WebP, menos de 5 MB cada una. Van directo a S3.</p>
          </div>
          <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden aria-label="Seleccionar imágenes" />
        </div>
        <progress id="progress" max="100" value="0" hidden aria-label="Progreso de subida"></progress>
        <p id="status" class="status" role="status" aria-live="polite" data-type="info"></p>
      </section>

      <section aria-labelledby="gallery-title">
        <div class="section-head">
          <h2 id="gallery-title">Galería <span id="count" class="count"></span></h2>
          <button id="refresh-btn" type="button" class="btn btn-secondary">Actualizar</button>
        </div>
        <p id="gallery-state" class="gallery-state" data-type="loading">Cargando imágenes…</p>
        <ul id="gallery" class="wall"></ul>
      </section>
    </main>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
